version: '3.8'

services:
  # ========================================================
  # PostgreSQL Relational Healthcare Database
  # ========================================================
  postgres:
    image: postgres:15-alpine
    container_name: meditwin_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: meditwin_ai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d meditwin_ai"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ========================================================
  # FastAPI Backend (AI Models, Document Intelligence, RAG)
  # ========================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: meditwin_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/meditwin_ai
      - SECRET_KEY=meditwin_super_secure_jwt_secret_key_2026_prod
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=120
      - REFRESH_TOKEN_EXPIRE_DAYS=7
      - UPLOAD_DIR=/app/uploads
      - PYTHONPATH=/app
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/models:/app/models
    depends_on:
      postgres:
        condition: service_healthy

  # ========================================================
  # React + Vite Clinical SaaS Frontend
  # ========================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: meditwin_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
